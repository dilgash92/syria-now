<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b6b43">
<title>سوريا الآن</title>
<style>body{margin:0;background:#f5f7f6;color:#18231f;font-family:Segoe UI,Tahoma,Arial,sans-serif}.boot{min-height:100vh;display:grid;place-items:center;color:#0b6b43;font-weight:700}</style>
</head>
<body><div class="boot">جاري فتح سوريا الآن…</div>
<script>
fetch('app.html').then(r=>r.text()).then(html=>{
const logo='<svg class="brand-logo-svg" viewBox="0 0 72 72" aria-label="سوريا الآن" role="img"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#063f2a"/><stop offset=".55" stop-color="#0b8f57"/><stop offset="1" stop-color="#35d58a"/></linearGradient></defs><path d="M36 3C18 3 5 16 5 33c0 22 21 29 31 36 10-7 31-14 31-36C67 16 54 3 36 3Z" fill="url(#lg)"/><path d="M22 28l5-8 8 1 8-5 8 6 3 8-7 4-3 8-9 5-7-5-7 1-3-7 4-8Z" fill="#fff" opacity=".96"/><path d="M28 22l7 2 8-4 6 5-2 6-7 1-5 6-7-2-4-5 4-9Z" fill="#0b6b43"/><circle cx="36" cy="34" r="18" fill="none" stroke="#b8ffd9" stroke-width="2" opacity=".55"/></svg>';
html=html.replace('<div class="logo">✚</div>',logo);
html=html.replace('</head>','<style>.brand-logo-svg{width:42px;height:42px;display:block;filter:drop-shadow(0 3px 5px rgba(6,63,42,.2))}@media(max-width:600px){.brand-logo-svg{width:38px;height:38px}}</style></head>');
document.open();document.write(html);document.close();
}).catch(()=>{document.querySelector('.boot').textContent='تعذر تحميل الموقع. أعد المحاولة.'});
</script></body></html>
